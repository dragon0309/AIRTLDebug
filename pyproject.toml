[project]
name = "airtldebug"
version = "0.1.0"
description = "RTL debug assistant for SystemVerilog/Verilog benchmark cases"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "google-genai>=2.8.0",
    "google-generativeai>=0.8.6",
    "python-dotenv>=1.2.2",
]

[dependency-groups]
dev = [
    "mypy>=2.1.0",
    "pytest>=8.0.0",
    "ruff>=0.15.14",
]

[tool.pytest.ini_options]
pythonpath = ["."]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]

[tool.mypy]
python_version = "3.12"
disallow_untyped_defs = true
